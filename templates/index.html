<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <header>
    <h1>💰 Expense Tracker</h1>
    <p class="subtitle">A small Flask + SQLite REST API with a live dashboard</p>
  </header>

  <section class="cards">
    <div class="card">
      <span class="card-label">Total Spent</span>
      <span class="card-value" id="totalSpent">₹0.00</span>
    </div>
    <div class="card">
      <span class="card-label">Transactions</span>
      <span class="card-value" id="totalCount">0</span>
    </div>
    <div class="card">
      <span class="card-label">Top Category</span>
      <span class="card-value" id="topCategory">–</span>
    </div>
  </section>

  <section class="main-grid">
    <div class="panel form-panel">
      <h2>Add Expense</h2>
      <form id="expenseForm">
        <label>Title
          <input type="text" id="title" required placeholder="e.g. Groceries">
        </label>
        <label>Amount
          <input type="number" id="amount" step="0.01" min="0.01" required placeholder="0.00">
        </label>
        <label>Category
          <select id="category" required>
            {% for c in categories %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Date
          <input type="date" id="date" required>
        </label>
        <label>Note (optional)
          <input type="text" id="note" placeholder="Any details...">
        </label>
        <button type="submit">Add Expense</button>
        <p class="form-error" id="formError"></p>
      </form>
    </div>

    <div class="panel chart-panel">
      <h2>Spending by Category</h2>
      <canvas id="categoryChart" height="220"></canvas>
    </div>
  </section>

  <section class="panel table-panel">
    <div class="table-header">
      <h2>Recent Expenses</h2>
      <select id="filterCategory">
        <option value="">All categories</option>
        {% for c in categories %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <table id="expenseTable">
      <thead>
        <tr>
          <th>Date</th><th>Title</th><th>Category</th><th>Note</th><th>Amount</th><th></th>
        </tr>
      </thead>
      <tbody id="expenseTableBody"></tbody>
    </table>
    <p id="emptyState" class="empty-state" style="display:none;">No expenses yet — add your first one above.</p>
  </section>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
